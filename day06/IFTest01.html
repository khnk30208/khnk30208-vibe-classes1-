<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>점수 : <span id="score"></span></p>
    <p id="result"></p>
</body>
<script>

    const d = document; // html 문서 객체

    const score = Math.floor( Math.random() * 100 ) + 1; 
    
    //html 영역을 가져오기.
    spanV = d.getElementById('score');
    pTag = d.getElementById('result');

    if(score >= 50) {
        spanV.append('합격');
        pTag.append(score);
    }else {
        spanV.append('불합격');
        pTag.append(score);
    }


</script>
</html>
