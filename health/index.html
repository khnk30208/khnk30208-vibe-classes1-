<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="나이·체중·신장을 입력하면 BMI·기초대사량·영양 상태를 분석해 주는 건강관리 대시보드"
    />
    <title>건강관리 대시보드</title>

    <!-- 폰트는 @import 대신 link 로 둔다. @import 는 CSS 파싱을 기다렸다가
         다시 요청이 나가 렌더가 그만큼 늦어진다 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!-- 첫 페인트 전에 저장된 테마를 적용해 화면이 번쩍이지 않게 한다 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('health:theme')
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (e) {
          /* 저장소를 못 읽으면 시스템 설정을 따른다 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
