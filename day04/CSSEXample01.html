<!DOCTYPE html>
<html lang="en">
<head></head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            border: 2px dotted rgb(96, 43, 102); /*두께 선모양 색상*/
        }

        .border-dot-Orange {
            border: 3px dotted Orange;
        }

    </style>
</head>
<body>
    <!-- emmet 기능은 개발툴에 따라 지원될 수도 있고 안될 수도 있다. -->
    <div>div1</div>
    <div class="border-dot-Orange">div2</div>
    <div>div3</div>
    <div class="border-dot-Orange">div4</div>
    <div>div5</div>
</body>
</html>
