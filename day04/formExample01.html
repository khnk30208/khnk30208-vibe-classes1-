<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <label for="userId">아이디: </label>
            <input type="text" id="userId" name="userId" placeholder="아이디를 입력">
        </div>
        <div>
            <label for="userPw">비밀번호: </label>
            <input type="password" id="userPw" name="passwd" placeholder="패스워드 입력">
        </div>
        <div>
            <label for="man">성별: </label>
            <input type="radio" value="남성" id="man" name="gender" checked> 남자
            <input type="radio" value="여성" id="woman" name="gender"> 여자
        </div>
        <div>
            <label for="music">취미생활 :  </label>
            <input type="checkbox" value="음악듣기" checked>음악듣기
            <input type="checkbox" value="영화감상" >영화감상
            <input type="checkbox" value="바람쐬기" >바람쐬기
        </div>
        <div>
            <label for="agency">전화번호</label>
            <select id="agency">
                <option value="011">011</option>
                <option value="012">012</option>
                <option value="013">013</option>
                <option value="014">014</option>
                <option value="015">015</option>
                <option value="016">016</option>
            </select>-
            <input type="text" value="" id="middleNum">
            -
            <input type="text" value="" id="lastNum">
        </div>      
        <div>
            <button type="submit">발사</button>
            <button type="reset">초기화</button>
        </div>      
    </form>
</body>
</html>
