<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또 생성기</title>
<link rel="stylesheet" href="myLotto.css">
</head>
<body>
  <div class="container">
    <h1>🎱 로또 생성기</h1>

    <div class="select-section">
      <div class="select-panel">
        <h2>포함 번호 <span class="count">(<span id="includeCount">0</span>/3)</span></h2>
        <p class="panel-desc">반드시 포함될 번호를 최대 3개까지 선택하세요.</p>
        <div class="number-grid" id="includeGrid"></div>
      </div>
      <div class="select-panel">
        <h2>불포함 번호 <span class="count">(<span id="excludeCount">0</span>/3)</span></h2>
        <p class="panel-desc">제외할 번호를 최대 3개까지 선택하세요.</p>
        <div class="number-grid" id="excludeGrid"></div>
      </div>
    </div>

    <div class="button-row">
      <button type="button" id="generateBtn" class="btn generate-btn">번호 생성</button>
      <button type="button" id="resetBtn" class="btn reset-btn">초기화</button>
    </div>

    <div class="result-section" id="resultSection">
      <p class="result-placeholder" id="resultPlaceholder">번호 생성 버튼을 누르면 추천 번호 5세트가 표시됩니다.</p>
    </div>
  </div>

<script src="myLotto.js"></script>
</body>
</html>
