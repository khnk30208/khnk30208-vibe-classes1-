<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --btn-font: 17px;                 /* 버튼 폰트 크기 (입력창 폰트는 이 값의 90%) */
  --pixel-font: "Galmuri11", "Galmuri9", "Courier New", monospace;

  /* 하늘 */
  --sky-top: #1f9ee0;

  /* 돌 프레임 */
  --stone-0: #05060a;               /* 가장 바깥 라인 */
  --stone-1: #1b1f2e;               /* 패널 바탕 */
  --ring-mid: #333a5c;              /* 강철빛 라인 */

  /* 포인트 색 */
  --cyan: #8feaff;
  --cyan-dim: #3fa6c9;
  --cyan-glow: rgba(110, 225, 255, 0.55);
  --purple: #cda6ff;
  --purple-dim: #8a63c9;
  --purple-glow: rgba(190, 140, 255, 0.5);

  --ink: #eef3ff;                   /* 기본 글자색(흰색 계열) */
  --ink-dim: #8fa0c4;               /* 보조 글자색 */
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;          /* 화면 중앙 정렬 */
  padding: 40px 20px;
  font-family: var(--pixel-font), "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  color: var(--ink);
  background: var(--sky-top);
  overflow: hidden;
  position: relative;
}

@keyframes sky-sway {
  from { transform: translate3d(0, 0, 0) scale(1.01); }
  to   { transform: translate3d(-12px, 6px, 0) scale(1.01); }
}

/* ---------- 프레임 래퍼(장식이 잘리지 않도록 분리) ---------- */
.frame-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
}

/* ---------- 모서리 장식: 픽셀 화살표(폰트 글리프 대신 도형으로 그려 항상 표시되도록 처리) ---------- */
.corner-chevron {
  position: absolute;
  z-index: 3;
  width: 13px;
  height: 13px;
  background: #2fc3f7;
  box-shadow: 0 0 0 1px var(--stone-0);
  filter: drop-shadow(0 0 5px var(--cyan-glow));
  animation: chevron-flicker 3.2s steps(2) infinite;
}

.chevron-tl { top: 6px;    left: 6px;  clip-path: polygon(0 0, 100% 0, 0 100%); }
.chevron-tr {
  top: 6px;    right: 6px;
  background: #9d5ce0;
  filter: drop-shadow(0 0 5px var(--purple-glow));
  animation-delay: .8s;
  clip-path: polygon(100% 0, 100% 100%, 0 0);
}
.chevron-bl { bottom: 6px; left: 6px;  animation-delay: 1.6s; clip-path: polygon(0 0, 0 100%, 100% 100%); }
.chevron-br {
  bottom: 6px; right: 6px;
  background: #9d5ce0;
  filter: drop-shadow(0 0 5px var(--purple-glow));
  animation-delay: 2.4s;
  clip-path: polygon(100% 100%, 0 100%, 100% 0);
}

@keyframes chevron-flicker {
  0%, 40%, 100% { opacity: 0.55; }
  20%           { opacity: 1; }
}

/* ---------- 돌(스톤) 패널 ---------- */
.container {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 42px 26px 30px;
  text-align: center;               /* 기본 중앙 정렬 */
  color: var(--ink);
  background: var(--stone-1);
  clip-path: polygon(
    16px 0, calc(100% - 16px) 0, 100% 16px,
    100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%,
    0 calc(100% - 16px), 0 16px
  );
  box-shadow:
    inset 0 0 0 4px var(--stone-0),
    inset 0 0 0 8px var(--ring-mid),
    inset 0 0 0 11px var(--stone-0),
    inset 0 0 0 14px #11131c;
  filter:
    drop-shadow(0 14px 0 rgba(0, 0, 0, 0.35))
    drop-shadow(0 0 26px rgba(110, 210, 255, 0.22));
}

.container::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.07) 50%, transparent 58%);
  background-size: 260% 260%;
  animation: sweep 7s steps(30) infinite;
  pointer-events: none;
}

@keyframes sweep {
  0%   { background-position: -60% -60%; }
  100% { background-position: 60% 60%; }
}

h1 {
  position: relative;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--ink);
  text-shadow: 0 0 10px var(--cyan-glow);
  margin-bottom: 22px;
}

/* ---------- 검색 영역 ---------- */
.search-box {
  position: relative;
  display: flex;
  gap: 10px;
}

#cityInput {
  flex: 1;
  min-width: 0;
  padding: 12px 16px;
  font-size: calc(var(--btn-font) * 0.9);   /* 버튼 크기의 90% */
  font-family: inherit;
  color: var(--ink);
  border: none;
  outline: none;
  background: #11131c;
  clip-path: polygon(
    6px 0, calc(100% - 6px) 0, 100% 6px,
    100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%,
    0 calc(100% - 6px), 0 6px
  );
  box-shadow:
    inset 0 0 0 2px var(--stone-0),
    inset 0 0 0 3px var(--cyan-dim);
  transition: box-shadow 0.2s;
}

#cityInput::placeholder { color: var(--ink-dim); }

#cityInput:focus {
  box-shadow:
    inset 0 0 0 2px var(--stone-0),
    inset 0 0 0 3px var(--cyan),
    0 0 10px 2px var(--cyan-glow);
}

.search-btn {
  padding: 12px 18px;
  font-size: var(--btn-font);
  font-family: inherit;
  font-weight: 700;
  color: #04121a;                       /* 어두운 청색 글자로 대비 확보 */
  border: none;
  cursor: pointer;
  background: linear-gradient(180deg, #8feaff 0%, #2c8fd9 100%); /* 푸른색 그라데이션 */
  clip-path: polygon(
    6px 0, calc(100% - 6px) 0, 100% 6px,
    100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%,
    0 calc(100% - 6px), 0 6px
  );
  box-shadow:
    inset 0 0 0 2px var(--stone-0),
    0 0 0 2px var(--stone-0),
    0 4px 0 0 var(--stone-0);
  transition: transform 0.1s, filter 0.2s;
}

.search-btn:hover { filter: brightness(1.1); }

.search-btn:active {
  transform: translateY(3px);
  box-shadow:
    inset 0 0 0 2px var(--stone-0),
    0 0 0 2px var(--stone-0),
    0 1px 0 0 var(--stone-0);
}

/* ---------- 날씨 카드 ---------- */
.weather-card {
  margin-top: 26px;
  animation: fadeUp 0.45s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.city {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
}

.description {
  margin-top: 4px;
  font-size: 13px;
  color: var(--cyan-dim);
}

.card-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 6px;
}

.weather-icon {
  width: 110px;
  height: 110px;
  margin-bottom: -6px;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  filter: drop-shadow(0 0 10px var(--cyan-glow));
  animation: icon-float 3.2s steps(8) infinite;
}

@keyframes icon-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

.temp {
  font-size: 46px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
  color: var(--cyan);
  text-shadow:
    0 0 8px var(--cyan-glow),
    0 0 20px var(--cyan-glow);
}

.temp-range {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
}

.pill {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  clip-path: polygon(
    5px 0, calc(100% - 5px) 0, 100% 5px,
    100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%,
    0 calc(100% - 5px), 0 5px
  );
}

.pill.max {
  background: rgba(63, 166, 201, 0.18);
  box-shadow: inset 0 0 0 2px var(--cyan-dim);
  color: var(--cyan);
}

.pill.min {
  background: rgba(138, 99, 201, 0.18);
  box-shadow: inset 0 0 0 2px var(--purple-dim);
  color: var(--purple);
}

/* ---------- 상세 정보(모서리가 살짝 둥근 네모 박스) ---------- */
.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 26px;
}

.tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 6px;
  border-radius: 10px;
  background: var(--stone-1);
  box-shadow:
    inset 0 0 0 2px var(--stone-0),
    inset 0 0 0 3px var(--ring-mid);
  transition: transform 0.15s;
  animation: tile-glow 4s steps(4) infinite;
}

.tile:nth-child(2) { animation-delay: .3s; }
.tile:nth-child(3) { animation-delay: .6s; }

.tile:hover { transform: translateY(-3px); }

@keyframes tile-glow {
  0%, 100% { box-shadow: inset 0 0 0 2px var(--stone-0), inset 0 0 0 3px var(--ring-mid); }
  50%      { box-shadow: inset 0 0 0 2px var(--stone-0), inset 0 0 0 3px var(--cyan-dim); }
}

.tile-icon {
  font-size: 20px;
  line-height: 1;
  filter: drop-shadow(0 0 4px var(--cyan-glow));
}

.tile-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-dim);
}

.tile-value {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}

.tile-value small {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-dim);
}

.arrow {
  display: inline-block;
  color: var(--cyan);
  font-weight: 700;
  line-height: 1;
  text-shadow: 0 0 6px var(--cyan-glow);
}

/* ---------- 상태 메시지 ---------- */
.message {
  margin-top: 18px;
  min-height: 1.2em;
  font-size: 13px;
  color: var(--ink-dim);
}

/* ==================== 모바일 앱 모드 (전체화면) ==================== */
@media (max-width: 480px), (max-height: 720px) {
  body {
    padding: 0;
  }
  .frame-wrap {
    max-width: none;
    width: 100vw;
    height: 100dvh;
  }
  .container {
    height: 100%;
    overflow-y: auto;
    clip-path: none;
    box-shadow:
      inset 0 0 0 4px var(--stone-0),
      inset 0 0 0 8px var(--ring-mid),
      inset 0 0 0 11px var(--stone-0);
    filter: none;
    padding:
      calc(env(safe-area-inset-top, 0px) + 26px)
      calc(env(safe-area-inset-right, 0px) + 22px)
      calc(env(safe-area-inset-bottom, 0px) + 20px)
      calc(env(safe-area-inset-left, 0px) + 22px);
  }
  .corner-chevron { display: none; }
  /* 전체화면 모드에서는 배경 구름 이미지가 패널에 완전히 가려져 보이지 않으므로
     불필요한 이미지 다운로드/디코딩을 막는다 (성능 최적화). */
  .pixel-sky { background-image: none; }
}

/* ==================== 앱 설치 버튼 ==================== */
.install-btn {
  display: block;
  margin: 16px auto 0;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--cyan);
  background: rgba(63, 166, 201, 0.12);
  border: none;
  cursor: pointer;
  box-shadow: inset 0 0 0 2px var(--cyan-dim);
  clip-path: polygon(
    5px 0, calc(100% - 5px) 0, 100% 5px,
    100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%,
    0 calc(100% - 5px), 0 5px
  );
  transition: filter 0.2s;
}

.install-btn:hover { filter: brightness(1.2); }
.install-btn[hidden] { display: none; }

</style>
</head>
<body>
  <div class="pixel-sky" aria-hidden="true"></div>

  <div class="frame-wrap">
    <span class="corner-chevron chevron-tl" aria-hidden="true"></span>
    <span class="corner-chevron chevron-tr" aria-hidden="true"></span>
    <span class="corner-chevron chevron-bl" aria-hidden="true"></span>
    <span class="corner-chevron chevron-br" aria-hidden="true"></span>

    <div class="container">
      <h1>☀️ 날씨 검색</h1>

      <form class="search-box" id="searchForm">
        <input type="text" id="cityInput" placeholder="도시 이름 입력 (예: Seoul)" autocomplete="off">
        <button type="submit" class="search-btn">검색</button>
      </form>

      <div class="weather-card" id="weatherCard" hidden></div>

      <p class="message" id="message"></p>

      <button type="button" class="install-btn" id="installBtn" hidden>📲 홈 화면에 앱 설치</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ==================== 설정 ====================
  // 아래 따옴표 사이에 OpenWeatherMap API 키를 입력하세요.
  // 키 발급: https://home.openweathermap.org/api_keys (무료 가입 후 발급)
  const API_KEY = "97d18319572b3537649d00267f011590";

  const API_URL = "https://api.openweathermap.org/data/2.5/weather";

  // ==================== DOM ====================
  const form = document.getElementById("searchForm");
  const cityInput = document.getElementById("cityInput");
  const weatherCard = document.getElementById("weatherCard");
  const message = document.getElementById("message");

  // ==================== 풍향 계산 (PRD 규칙) ====================
  function getWindDirection(deg) {
    const d = ((deg % 360) + 360) % 360; // 0 ~ 359 로 정규화
    if (d === 0) return "북";            // 0 또는 360
    if (d < 90) return "북동";           // 0 < x < 90
    if (d === 90) return "동";           // 90
    if (d < 180) return "남동";          // 90 < x < 180
    if (d === 180) return "남";          // 180
    if (d < 270) return "남서";          // 180 < x < 270
    if (d === 270) return "서";          // 270
    return "북서";                       // 270 < x < 360
  }

  // ==================== 상태 메시지 ====================
  function showMessage(text) {
    message.textContent = text;
    weatherCard.hidden = true;
  }

  // ==================== HTML 이스케이프 ====================
  // API 응답값(도시명, 날씨 설명 등)을 innerHTML에 그대로 넣지 않고
  // 특수문자를 이스케이프해서 삽입한다 (마크업 깨짐/삽입 방지).
  function escapeHtml(value) {
    const escapeMap = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
    return String(value).replace(/[&<>"']/g, (ch) => escapeMap[ch]);
  }

  // ==================== 날씨 카드 렌더링 ====================
  function renderWeather(data) {
    const info = data.weather[0];
    const main = data.main;
    const wind = data.wind || {};
    const deg = typeof wind.deg === "number" ? wind.deg : 0;
    const speed = typeof wind.speed === "number" ? wind.speed : 0;

    // API 응답에서 온 문자열은 모두 이스케이프한 뒤 사용한다.
    const cityName = escapeHtml(data.name);
    const description = escapeHtml(info.description);
    // 작은 원본(50px) 아이콘을 확대 표시해 픽셀 느낌을 살림 (CSS의 image-rendering: pixelated 와 함께 사용)
    const iconUrl = `https://openweathermap.org/img/wn/${escapeHtml(info.icon)}.png`;
    const country = data.sys && data.sys.country ? `, ${escapeHtml(data.sys.country)}` : "";

    weatherCard.innerHTML = `
      <div class="city">${cityName}${country}</div>
      <div class="description">${description}</div>
      <div class="card-main">
        <img class="weather-icon" src="${iconUrl}" alt="${description}">
        <div class="temp">${Math.round(main.temp)}°</div>
      </div>
      <div class="temp-range">
        <span class="pill max">최고 ${Math.round(main.temp_max)}°</span>
        <span class="pill min">최저 ${Math.round(main.temp_min)}°</span>
      </div>
      <div class="detail-grid">
        <div class="tile">
          <span class="tile-icon">🧭</span>
          <span class="tile-label">풍향</span>
          <span class="tile-value"><span class="arrow" style="transform: rotate(${deg}deg)">↑</span> ${getWindDirection(deg)} <small>${deg}°</small></span>
        </div>
        <div class="tile">
          <span class="tile-icon">💨</span>
          <span class="tile-label">풍속</span>
          <span class="tile-value">${speed} <small>m/s</small></span>
        </div>
        <div class="tile">
          <span class="tile-icon">💧</span>
          <span class="tile-label">습도</span>
          <span class="tile-value">${main.humidity}<small>%</small></span>
        </div>
      </div>
    `;

    message.textContent = "";
    weatherCard.hidden = false;
  }

  // ==================== API 호출 ====================
  async function fetchWeather(city) {
    if (!API_KEY) {
      showMessage("API 키가 설정되지 않았습니다. weather.js 파일 상단의 API_KEY 값을 입력하세요.");
      return;
    }

    showMessage("날씨 정보를 불러오는 중...");

    const params = new URLSearchParams({
      q: city,
      appid: API_KEY,
      units: "metric", // 섭씨(°C) 로 표시
      lang: "kr",      // 한글 날씨 설명
    });

    try {
      const response = await fetch(`${API_URL}?${params.toString()}`);

      if (!response.ok) {
        if (response.status === 404) {
          showMessage(`'${city}' 도시를 찾을 수 없습니다.`);
        } else if (response.status === 401) {
          showMessage("API 키가 올바르지 않습니다. 키를 다시 확인하세요.");
        } else {
          showMessage(`오류가 발생했습니다. (${response.status})`);
        }
        return;
      }

      const data = await response.json();
      renderWeather(data);
    } catch (error) {
      showMessage("네트워크 오류가 발생했습니다. 잠시 후 다시 시도하세요.");
    }
  }

  // ==================== 이벤트 ====================
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const city = cityInput.value.trim();
    if (!city) {
      showMessage("도시 이름을 입력하세요.");
      cityInput.focus();
      return;
    }
    fetchWeather(city);
  });
})();

(function () {
  "use strict";


  // ==================== PWA: 서비스워커 등록 (앱 껍데기 오프라인 캐싱) ====================
  // 별도 .js 파일 없이 Blob으로 서비스워커 코드를 만들어 등록한다.
  // 주의: file:// 로 직접 열면 보안 컨텍스트가 아니라 등록이 조용히 실패할 수 있다.
  //       로컬 서버(https/localhost)에서 열어야 정상 동작한다.
  if ("serviceWorker" in navigator) {
    const swSource = `
      const CACHE_NAME = "pixel-weather-shell-v1";
      self.addEventListener("install", () => { self.skipWaiting(); });
      self.addEventListener("activate", (event) => { event.waitUntil(self.clients.claim()); });
      self.addEventListener("fetch", (event) => {
        if (event.request.method !== "GET") return;
        // 네트워크 우선(network-first) 전략: 실시간 날씨 데이터가 캐시된 옛날 값으로
        // 계속 표시되는 것을 막기 위해, 온라인일 때는 항상 최신 네트워크 응답을 쓰고
        // 오프라인일 때만 마지막으로 저장해 둔 캐시로 대체한다.
        event.respondWith(
          fetch(event.request)
            .then((response) => {
              if (response && response.ok) {
                const copy = response.clone();
                caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy));
              }
              return response;
            })
            .catch(() => caches.match(event.request))
        );
      });
    `;
    const swBlob = new Blob([swSource], { type: "text/javascript" });
    const swUrl = URL.createObjectURL(swBlob);
    window.addEventListener("load", () => {
      navigator.serviceWorker.register(swUrl).catch(() => {
        // 설치형 앱으로 열 수 없는 환경(file:// 등)에서는 조용히 무시한다.
      });
    });
  }

  // ==================== PWA: 홈 화면 설치 버튼 ====================
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    if (installBtn) installBtn.hidden = false;
  });

  if (installBtn) {
    installBtn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      installBtn.hidden = true;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
    });
  }

  window.addEventListener("appinstalled", () => {
    if (installBtn) installBtn.hidden = true;
  });
})();

</script>
</body>
</html>
